name: aidrs
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - samtools
  - pyarrow
  - ml_dtypes
  - selene-sdk
  - optree
  - networkx
  - pysam
  - psutil
  - docopt
  - pytorch=2.0
  - torch-fftconv
  - tensorflow=2.13
  - keras
  - polars=1.33
  - gffutils
  - tqdm
  # imported by src/get_terminal_sites.py (3' end estimation) and pulled in
  # transitively by the test suite -- pinned explicitly so a fresh environment
  # does not depend on another package's resolution
  - scikit-learn
  - scipy
  # test runner (Layer-1 defensive unit + integration tests)
  - pytest>=8.0